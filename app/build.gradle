plugins {
    id 'com.android.application'
}

android {
    namespace 'online.zhaan.smsforwarder'
    compileSdk 34

    defaultConfig {
        applicationId 'online.zhaan.smsforwarder'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
}
